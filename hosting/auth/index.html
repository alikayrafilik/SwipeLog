<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#052f3e" />
    <title>Email action complete | SwipeLog</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #031e2a;
        color: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 0%, rgba(26, 98, 116, 0.55), transparent 42%),
          linear-gradient(180deg, #052f3e 0%, #031e2a 100%);
      }

      main {
        width: min(100%, 430px);
        padding: 32px 24px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: #f9c80e;
        color: #073445;
        font-size: 38px;
        font-weight: 900;
      }

      .brand {
        margin: 0 0 24px;
        color: #f9c80e;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 42px);
        line-height: 1.1;
      }

      p {
        margin: 16px auto 0;
        max-width: 34ch;
        color: rgba(255, 255, 255, 0.76);
        font-size: 16px;
        font-weight: 600;
        line-height: 1.6;
      }

      a {
        min-height: 56px;
        margin-top: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: #f9c80e;
        color: #073445;
        font-size: 17px;
        font-weight: 900;
        text-decoration: none;
      }

      small {
        display: block;
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <div class="brand">SWIPELOG</div>
      <h1>Email action complete</h1>
      <p>Your email request was completed. Return to SwipeLog to continue.</p>
      <a href="swipelog://auth">Open SwipeLog</a>
      <small>If SwipeLog does not open automatically, close this page and open the app.</small>
    </main>
  </body>
</html>
